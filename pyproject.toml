[project]
name = "secure-health-data"
version = "2.0.0"
description = "Plataforma de análise clínica com IA: exames laboratoriais, tendências, alertas de segurança, RAG e prontuário SOAP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "chromadb>=0.5",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "openpyxl>=3.1",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
